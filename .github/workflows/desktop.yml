name: Desktop packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            bundles: deb
          - name: macos-apple-silicon
            runner: macos-15
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache Linux package downloads
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-desktop-${{ matrix.runner }}-${{ hashFiles('scripts/install-linux-ci-packages.sh') }}
      - name: Install Linux build and package tools
        if: runner.os == 'Linux'
        run: scripts/install-linux-ci-packages.sh
      - run: npm ci
      - run: npm run desktop:test
      - run: python3 scripts/check-desktop-versions.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native packages
        run: npm run desktop:build -- --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify and package Linux artifacts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          scripts/verify-deb.sh "${packages[0]}"
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub org.gnome.Platform//50 org.gnome.Sdk//50
          scripts/build-flatpak.sh "${packages[0]}"
          scripts/verify-flatpak.sh dist/tijara-tides-x86_64.flatpak
          cp "${packages[0]}" dist/
      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          test -x 'src-tauri/target/release/bundle/macos/Tijara Tides.app/Contents/MacOS/tijara-tides'
          ditto -c -k --sequesterRsrc --keepParent \
            'src-tauri/target/release/bundle/macos/Tijara Tides.app' \
            'dist/Tijara-Tides.app.zip'
          cp src-tauri/target/release/bundle/dmg/*.dmg dist/
      - uses: actions/upload-artifact@v7
        with:
          name: tijara-tides-${{ matrix.name }}
          path: |
            dist/*.deb
            dist/*.flatpak
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
