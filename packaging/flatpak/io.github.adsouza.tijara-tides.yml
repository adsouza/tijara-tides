# Repackage the native Ubuntu 24.04 .deb; GNOME 50 meets its glibc floor.
app-id: io.github.adsouza.tijara-tides
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: tijara-tides
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: tijara-tides
    buildsystem: simple
    build-commands:
      - ar x app.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/tijara-tides /app/bin/tijara-tides
      - install -Dm644 "usr/share/applications/Tijara Tides.desktop" /app/share/applications/io.github.adsouza.tijara-tides.desktop
      - sed -i 's/^Icon=.*/Icon=io.github.adsouza.tijara-tides/' /app/share/applications/io.github.adsouza.tijara-tides.desktop
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/tijara-tides.png /app/share/icons/hicolor/32x32/apps/io.github.adsouza.tijara-tides.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/tijara-tides.png /app/share/icons/hicolor/128x128/apps/io.github.adsouza.tijara-tides.png
      - install -Dm644 usr/share/icons/hicolor/scalable/apps/tijara-tides.svg /app/share/icons/hicolor/scalable/apps/io.github.adsouza.tijara-tides.svg
      - install -Dm644 usr/share/metainfo/io.github.adsouza.tijara-tides.metainfo.xml /app/share/metainfo/io.github.adsouza.tijara-tides.metainfo.xml
    sources:
      - type: file
        path: app.deb
